<!DOCTYPE html>
<html>
<head>
  <title>jsPsych Circle Display</title>
  <!-- jsPsych core library and CSS -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <!-- html-keyboard-response plugin -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  
  <style>
    /* 全体の背景色を灰色に設定 */
    body {
      background-color: #808080;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white; /* テキストを読みやすくするため白に設定 */
    }

    /* 赤い円のデザイン定義 */
    .red-circle {
      height: 100px;
      width: 100px;
      background-color: #ff0000;
      border-radius: 50%;
      margin: 0 auto;
    }
    
    .container {
      text-align: center;
    }

    /* jsPsychのデフォルトスタイルを上書きして背景色を統一 */
    .jspsych-display-element {
      background-color: #808080;
      color: white;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
</body>
<script>
  // jsPsychの初期化
  const jsPsych = initJsPsych({
    display_element: 'jspsych-target'
  });

  // タイムラインの作成
  const timeline = [];

  // 1. 赤い円を表示するトライアル
  const circle_trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="container">
        <div class="red-circle"></div>
        <p>スペースキーを押して終了してください</p>
      </div>
    `,
    choices: [' '], // スペースキーのみ受け付ける
    data: {
      task: 'red_circle_display'
    }
  };
  timeline.push(circle_trial);

  // 2. 終了メッセージ
  const end_message = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: "終了しました。",
    choices: "NO_KEYS",
    trial_duration: 2000
  };
  timeline.push(end_message);

  // 実験の実行
  jsPsych.run(timeline);
</script>
</html>
