<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学実験室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6; /* 薄いグレー */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .start-button {
            background-color: #3b82f6; /* 青いボタン */
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .start-button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .start-button:active {
            transform: translateY(0);
        }

        /* アラートの代わりのカスタムメッセージボックス用スタイル */
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">心理学実験室へようこそ</h1>
        <button id="start-btn" class="start-button">
            実験を開始する
        </button>
    </div>

    <!-- カスタムメッセージボックス（ブラウザのalertの代わり） -->
    <div id="overlay"></div>
    <div id="custom-alert">
        <p style="font-size: 1.5rem; margin-bottom: 1.5rem; color: #374151;">Hello World!</p>
        <button id="close-btn" style="background: #ef4444; color: white; padding: 0.5rem 1.5rem; border-radius: 0.5rem; border: none; cursor: pointer;">閉じる</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const customAlert = document.getElementById('custom-alert');
            const overlay = document.getElementById('overlay');
            const closeBtn = document.getElementById('close-btn');

            // 実験開始ボタンのクリックイベント
            startBtn.addEventListener('click', () => {
                // ブラウザ標準のalertの代わりを表示
                overlay.style.display = 'block';
                customAlert.style.display = 'block';
            });

            // 閉じるボタンのイベント
            closeBtn.addEventListener('click', () => {
                overlay.style.display = 'none';
                customAlert.style.display = 'none';
            });

            // 背景クリックで閉じる
            overlay.addEventListener('click', () => {
                overlay.style.display = 'none';
                customAlert.style.display = 'none';
            });
        });
    </script>
</body>
</html>
