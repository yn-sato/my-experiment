<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task - Automatic Save Version</title>
    
    <!-- jsPsych 7.3.4 Core -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
    
    <!-- jsPsych Plugins -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>

    <style>
        body {
            background-color: #F9FAFB;
            color: #1F2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 教示テキストのスタイル */
        .instruction-text {
            font-size: 20px;
            line-height: 1.8;
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        /* 刺激（文字）のスタイル */
        .stimulus-text {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* 注視点（+）のスタイル */
        .fixation {
            font-size: 64px;
            color: #9CA3AF;
            font-weight: 300;
        }

        /* jsPsychのコンテナ調整 */
        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* データ表示・進捗用のコンテナ */
        .data-display-container {
            width: 90%;
            max-width: 650px;
            text-align: center;
            background: #FFFFFF;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .data-display-container h2 {
            margin-top: 0;
            font-size: 24px;
            color: #111827;
        }

        .data-display-container p {
            font-size: 15px;
            color: #4B5563;
            line-height: 1.6;
        }
        
        textarea {
            width: 100%;
            height: 180px;
            margin-top: 20px;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            color: #374151;
            background-color: #F3F4F6;
            border-radius: 8px;
            border: 1px solid #D1D5DB;
            resize: none;
        }

        /* カスタム入力フォームの調整 */
        .jspsych-survey-text-question {
            margin: 20px 0;
            text-align: left;
        }

        .jspsych-survey-text-question p {
            font-size: 18px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .jspsych-survey-text-question input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #D1D5DB;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .jspsych-survey-text-question input[type="text"]:focus {
            border-color: #3B82F6;
        }

        .jspsych-btn {
            background-color: #2563EB !important;
            color: white !important;
            padding: 10px 24px !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            border: none !important;
            cursor: pointer !important;
            transition: background-color 0.2s !important;
        }

        .jspsych-btn:hover {
            background-color: #1D4ED8 !important;
        }

        /* スピナー（ローディングアニメーション） */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #2563EB;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // GASのウェブアプリデプロイURL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx8E584vA1cXDPSAnTMZJspeuZSx7sp1U22_Vq4re7NUhHhdcgqz-XFU0uCbku-h8ih/exec";

        // jsPsychの初期化
        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                // 実験終了時にクリーンなデータを抽出し自動送信をトリガー
                processAndSendData();
            }
        });

        const timeline = [];

        // (1) 参加者情報（ID）の入力画面
        const participant_id_trial = {
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: "参加者ID（例：学籍番号や氏名など）を入力してください。",
                    placeholder: "IDを入力",
                    required: true,
                    name: "participant_id"
                }
            ],
            button_label: "次へ進む",
            on_finish: function(data) {
                // 入力されたIDの抽出
                const response_id = data.response.participant_id.trim();
                const timestampStr = new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
                
                // 以降の全試行のデータにIDと実施日時を自動付与
                jsPsych.data.addProperties({
                    subject_id: response_id,
                    timestamp: timestampStr
                });
            }
        };
        timeline.push(participant_id_trial);

        // (2) 教示画面
        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction-text">
                    <p style="font-weight: bold; font-size: 24px; margin-bottom: 24px;">ストループ課題</p>
                    <p>画面に表示される文字の「<strong>色</strong>」を、できるだけ早く正確にキーボードで答えてください（文字の意味に惑わされないように注意してください）。</p>
                    <div style="margin: 24px auto; background: #F3F4F6; padding: 20px; border-radius: 12px; width: fit-content; text-align: left; border: 1px solid #E5E7EB;">
                        <span style="color: red; font-weight: bold; font-size: 22px; display: inline-block; width: 60px;">赤色</span> の文字なら <strong><kbd style="background:#fff; padding:2px 6px; border:1px solid #ccc; border-radius:4px;">R</kbd></strong> キー<br>
                        <span style="color: blue; font-weight: bold; font-size: 22px; display: inline-block; width: 60px;">青色</span> の文字なら <strong><kbd style="background:#fff; padding:2px 6px; border:1px solid #ccc; border-radius:4px;">B</kbd></strong> キー<br>
                        <span style="color: green; font-weight: bold; font-size: 22px; display: inline-block; width: 60px;">緑色</span> の文字なら <strong><kbd style="background:#fff; padding:2px 6px; border:1px solid #ccc; border-radius:4px;">G</kbd></strong> キー
                    </div>
                    <p style="color: #4B5563;">準備ができたら、<strong>スペースキー</strong>を押すと開始します。</p>
                </div>
            `,
            choices: [' ']
        };
        timeline.push(instructions);

        // 刺激の設定
        const words = ["赤", "青", "緑"];
        const colors = [
            { name: "red", hex: "#FF0000", key: "r" },
            { name: "blue", hex: "#0000FF", key: "b" },
            { name: "green", hex: "#008000", key: "g" }
        ];

        const stimuli_pool = [];
        words.forEach(word => {
            colors.forEach(color => {
                // 一致/不一致の判定
                let condition = "incongruent";
                if ((word === "赤" && color.name === "red") ||
                    (word === "青" && color.name === "blue") ||
                    (word === "緑" && color.name === "green")) {
                    condition = "congruent";
                }
                
                stimuli_pool.push({
                    word: word,
                    color_hex: color.hex,
                    correct_response: color.key,
                    condition: condition
                });
            });
        });

        // a. 注視点 (+)
        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="fixation">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500
        };

        // b. 刺激提示
        const stroop_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                const word = jsPsych.timelineVariable('word');
                const color = jsPsych.timelineVariable('color_hex');
                return `<div class="stimulus-text" style="color: ${color};">${word}</div>`;
            },
            choices: ['r', 'g', 'b'],
            data: {
                task: 'stroop',
                word: jsPsych.timelineVariable('word'),
                color: jsPsych.timelineVariable('color_hex'),
                condition: jsPsych.timelineVariable('condition'),
                correct_response: jsPsych.timelineVariable('correct_response')
            },
            on_finish: function(data) {
                // 正誤判定：正解なら "true"、不正解なら "false" の文字列を厳密に記録
                const isCorrect = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
                data.correct = isCorrect ? "true" : "false";
            }
        };

        // c. 試行間隔 (ITI)
        const iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '',
            choices: "NO_KEYS",
            trial_duration: 1000
        };

        // メイン試行ループの設定 (ランダムに10試行抽出)
        const test_procedure = {
            timeline: [fixation, stroop_trial, iti],
            timeline_variables: stimuli_pool,
            sample: {
                type: 'with-replacement',
                size: 10 
            }
        };
        timeline.push(test_procedure);

        /**
         * 必要な列のみを抽出したCSV文字列を作成する関数
         * @param {Array} objArray - jsPsychからフィルターしたローデータ配列
         * @returns {string} 整形されたCSV文字列
         */
        function extractCleanCSV(objArray) {
            if (objArray.length === 0) return '';
            
            // 出力したいクリーンなヘッダー
            const headers = ['subject_id', 'timestamp', 'word', 'color', 'condition', 'rt', 'correct'];
            let csvLines = [];
            
            // ヘッダー行を追加
            csvLines.push(headers.join(','));
            
            // 各行データの追加
            objArray.forEach(trial => {
                let line = headers.map(header => {
                    let val = trial[header];
                    if (val === undefined || val === null) {
                        return '';
                    }
                    // 文字列内にカンマ等が含まれる場合のエスケープ処理
                    let strVal = String(val);
                    if (strVal.includes(',') || strVal.includes('\n') || strVal.includes('\r') || strVal.includes('"')) {
                        strVal = `"${strVal.replace(/"/g, '""')}"`;
                    }
                    return strVal;
                });
                csvLines.push(line.join(','));
            });
            
            return csvLines.join('\r\n');
        }

        /**
         * 指数バックオフ付きのデータ送信関数
         * @param {string} url - GASウェブアプリのURL
         * @param {string} csvData - 送信するCSV文字列
         * @param {number} retries - 最大再試行回数
         * @param {number} delay - 初期遅延ミリ秒
         */
        async function sendDataWithRetry(url, csvData, retries = 5, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        body: csvData
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTPエラー。ステータス: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    if (result && result.status === 'success') {
                        return result; // 成功
                    } else {
                        throw new Error((result && result.message) || "サーバー処理エラーが発生しました。");
                    }
                } catch (error) {
                    console.warn(`送信試行 ${i + 1} 回目が失敗しました。${delay}ms後に再試行します...`, error);
                    if (i === retries - 1) {
                        throw error; // 全試行失敗時に呼び出し元に例外を投げる
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2; // 指数バックオフ
                }
            }
        }

        /**
         * 実験データをフィルタリングし、自動送信・結果画面の表示を行う関数
         */
        function processAndSendData() {
            // 安全にDOMの差し替えを行うため jsPsych.getDisplayElement() を取得
            const displayEl = jsPsych.getDisplayElement();
            
            // 1. ストループ試行(task: 'stroop')の行のみを抽出
            const rawStroopTrials = jsPsych.data.get().filter({ task: 'stroop' }).values();
            
            // 2. 必要な分析用カラムだけを持つCSVを作成
            const cleanCSV = extractCleanCSV(rawStroopTrials);

            // 送信中の画面表示
            displayEl.innerHTML = `
                <div class="data-display-container">
                    <h2>実験データを保存しています</h2>
                    <div class="spinner"></div>
                    <p>データを安全にスプレッドシートへ送信しています。画面を閉じずにお待ちください...</p>
                </div>
            `;

            // 3. GASウェブアプリへの非同期自動送信
            sendDataWithRetry(GAS_WEB_APP_URL, cleanCSV)
                .then(result => {
                    // 送信成功時のUI表示
                    displayEl.innerHTML = `
                        <div class="data-display-container">
                            <h2 style="color: #10B981; font-weight: bold;">実験終了（自動保存完了）</h2>
                            <p>実験は正常に完了し、データはGoogleスプレッドシートに正常に自動保存されました。ご協力ありがとうございました。</p>
                            <p style="font-size: 13px; color: #6B7280; margin-top: 24px;">【念のための確認用保存データ（CSV）】</p>
                            <textarea readonly onclick="this.select()">${cleanCSV}</textarea>
                        </div>
                    `;
                })
                .catch(error => {
                    // エラー発生時のUI表示。手動コピペで復旧できるフォールバック手段を提供
                    console.error("データ送信に最終同期失敗:", error);
                    displayEl.innerHTML = `
                        <div class="data-display-container" style="border-top: 6px solid #EF4444;">
                            <h2 style="color: #EF4444; font-weight: bold;">データの自動保存に失敗しました</h2>
                            <p>一時的な接続エラー、またはGASの設定エラーが発生した可能性があります。</p>
                            <p style="color: #EF4444; font-weight: 600;">※データを消失しないため、お手数ですが、以下のテキストエリアの内容をすべてコピー（Ctrl+A、またはクリックして全選択）し、実験実施者にメール等でお送りください。</p>
                            <textarea readonly onclick="this.select()" style="border-color: #FCA5A5;">${cleanCSV}</textarea>
                        </div>
                    `;
                });
        }

        // 実験ラン
        jsPsych.run(timeline);

    </script>
</body>
</html>
